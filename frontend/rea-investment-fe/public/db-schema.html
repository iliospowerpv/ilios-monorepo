id"}, {"from": "project_facts", "fromCol": "site_id", "to": "sites", "toCol": "id"}, {"from": "sales_state_transitions", "fromCol": "site_id", "to": "sites", "toCol": "id"}, {"from": "sales_state_transitions", "fromCol": "changed_by_id", "to": "users", "toCol": "id"}, {"from": "sales_state_transitions", "fromCol": "deal_id", "to": "deals", "toCol": "id"}, {"from": "sessions", "fromCol": "user_id", "to": "users", "toCol": "id"}, {"from": "site_additional_fields", "fromCol": "assigned_owner_id", "to": "users", "toCol": "id"}, {"from": "site_additional_fields", "fromCol": "site_id", "to": "sites", "toCol": "id"}, {"from": "site_visit_uploads", "fromCol": "site_visit_id", "to": "site_visits", "toCol": "id"}, {"from": "site_visit_uploads", "fromCol": "user_id", "to": "users", "toCol": "id"}, {"from": "site_visits", "fromCol": "task_id", "to": "tasks", "toCol": "id"}, {"from": "site_visits", "fromCol": "creator_id", "to": "users", "toCol": "id"}, {"from": "sites", "fromCol": "company_id", "to": "companies", "toCol": "id"}, {"from": "sites", "fromCol": "waived_by_id", "to": "users", "toCol": "id"}, {"from": "sites", "fromCol": "signed_agreement_document_id", "to": "documents", "toCol": "id"}, {"from": "sites", "fromCol": "name_override_by_id", "to": "users", "toCol": "id"}, {"from": "sites_weather", "fromCol": "site_id", "to": "sites", "toCol": "id"}, {"from": "tasks", "fromCol": "document_id", "to": "documents", "toCol": "id"}, {"from": "tasks", "fromCol": "alert_id", "to": "alerts", "toCol": "id"}, {"from": "tasks", "fromCol": "creator_id", "to": "users", "toCol": "id"}, {"from": "tasks", "fromCol": "board_id", "to": "boards", "toCol": "id"}, {"from": "tasks", "fromCol": "assignee_id", "to": "users", "toCol": "id"}, {"from": "tasks", "fromCol": "affected_device_id", "to": "devices", "toCol": "id"}, {"from": "tasks", "fromCol": "status_id", "to": "board_statuses", "toCol": "id"}, {"from": "telemetry_devices_mapping", "fromCol": "device_id", "to": "devices", "toCol": "id"}, {"from": "telemetry_sites_mapping", "fromCol": "connection_id", "to": "das_connections", "toCol": "id"}, {"from": "telemetry_sites_mapping", "fromCol": "site_id", "to": "sites", "toCol": "id"}, {"from": "user_company_access", "fromCol": "role_profile_key", "to": "role_profiles", "toCol": "key"}, {"from": "user_company_access", "fromCol": "created_by_user_id", "to": "users", "toCol": "id"}, {"from": "user_company_access", "fromCol": "user_id", "to": "users", "toCol": "id"}, {"from": "user_company_access", "fromCol": "company_id", "to": "companies", "toCol": "id"}, {"from": "user_invitations", "fromCol": "user_id", "to": "users", "toCol": "id"}, {"from": "user_password_recovery", "fromCol": "user_id", "to": "users", "toCol": "id"}, {"from": "user_portfolio_access", "fromCol": "created_by_user_id", "to": "users", "toCol": "id"}, {"from": "user_portfolio_access", "fromCol": "user_id", "to": "users", "toCol": "id"}, {"from": "user_portfolio_access", "fromCol": "portfolio_hub_company_id", "to": "companies", "toCol": "id"}, {"from": "user_projects", "fromCol": "user_id", "to": "users", "toCol": "id"}, {"from": "user_projects", "fromCol": "created_by_user_id", "to": "users", "toCol": "id"}, {"from": "user_projects", "fromCol": "company_id", "to": "companies", "toCol": "id"}, {"from": "user_projects", "fromCol": "site_id", "to": "sites", "toCol": "id"}, {"from": "users", "fromCol": "role_id", "to": "roles", "toCol": "id"}, {"from": "users", "fromCol": "parent_company_id", "to": "companies", "toCol": "id"}];

const tableGroupMap = {};
Object.entries(groupDefs).forEach(([group, def]) => {
  def.tables.forEach(t => { tableGroupMap[t] = { group, color: def.color }; });
});

const allTables = Object.keys(tableColumns);
allTables.forEach(t => {
  if (!tableGroupMap[t]) tableGroupMap[t] = { group: 'System', color: '#6b7280' };
});

let nodes = {};
let scale = 0.7;
let offsetX = 50, offsetY = 50;
let dragging = false, dragStartX, dragStartY, dragOffsetX, dragOffsetY;
let selectedTable = null;
let hoveredNode = null;

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function initNodes() {
  const groupPositions = {};
  const groupOrder = Object.keys(groupDefs);
  const cols = 3;
  const groupW = 600, groupH = 500;

  groupOrder.forEach((g, i) => {
    const col = i % cols;
    const row = Math.floor(i / cols);
    groupPositions[g] = { x: col * groupW + 80, y: row * groupH + 60 };
  });

  allTables.forEach(t => {
    const gi = tableGroupMap[t];
    const gp = groupPositions[gi.group] || { x: 0, y: 0 };
    const tablesInGroup = groupDefs[gi.group]?.tables || [t];
    const idx = tablesInGroup.indexOf(t);
    const perRow = 3;
    const col = idx % perRow;
    const row = Math.floor(idx / perRow);

    nodes[t] = {
      x: gp.x + col * 190,
      y: gp.y + row * 90,
      w: 170,
      h: 60,
      color: gi.color,
      group: gi.group
    };
  });
}

function resize() {
  canvas.width = canvas.parentElement.clientWidth;
  canvas.height = canvas.parentElement.clientHeight;
  draw();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.translate(offsetX, offsetY);
  ctx.scale(scale, scale);

  fkData.forEach(fk => {
    const from = nodes[fk.from];
    const to = nodes[fk.to];
    if (!from || !to) return;

    const isHighlighted = selectedTable && (fk.from === selectedTable || fk.to === selectedTable);
    const isHovered = hoveredNode && (fk.from === hoveredNode || fk.to === hoveredNode);

    ctx.beginPath();
    ctx.strokeStyle = isHighlighted ? '#38bdf8' : isHovered ? '#64748b' : '#1e293b';
    ctx.lineWidth = isHighlighted ? 2 : 1;
    ctx.globalAlpha = isHighlighted ? 1 : isHovered ? 0.6 : 0.3;

    const fx = from.x + from.w / 2;
    const fy = from.y + from.h / 2;
    const tx = to.x + to.w / 2;
    const ty = to.y + to.h / 2;

    ctx.moveTo(fx, fy);
    const mx = (fx + tx) / 2;
    ctx.bezierCurveTo(mx, fy, mx, ty, tx, ty);
    ctx.stroke();

    if (isHighlighted) {
      const angle = Math.atan2(ty - fy, tx - fx);
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(tx - 8 * Math.cos(angle - 0.4), ty - 8 * Math.sin(angle - 0.4));
      ctx.lineTo(tx - 8 * Math.cos(angle + 0.4), ty - 8 * Math.sin(angle + 0.4));
      ctx.closePath();
      ctx.fillStyle = '#38bdf8';
      ctx.fill();
    }

    ctx.globalAlpha = 1;
  });

  allTables.forEach(t => {
    const n = nodes[t];
    const isSelected = t === selectedTable;
    const isRelated = selectedTable && fkData.some(fk =>
      (fk.from === selectedTable && fk.to === t) || (fk.to === selectedTable && fk.from === t)
    );
    const isHov = t === hoveredNode;
    const dimmed = selectedTable && !isSelected && !isRelated;

    ctx.globalAlpha = dimmed ? 0.2 : 1;

    ctx.fillStyle = isSelected ? n.color : '#1e293b';
    ctx.strokeStyle = isSelected ? '#fff' : isHov ? n.color : '#334155';
    ctx.lineWidth = isSelected ? 2.5 : isHov ? 2 : 1;

    const r = 8;
    ctx.beginPath();
    ctx.moveTo(n.x + r, n.y);
    ctx.lineTo(n.x + n.w - r, n.y);
    ctx.arcTo(n.x + n.w, n.y, n.x + n.w, n.y + r, r);
    ctx.lineTo(n.x + n.w, n.y + n.h - r);
    ctx.arcTo(n.x + n.w, n.y + n.h, n.x + n.w - r, n.y + n.h, r);
    ctx.lineTo(n.x + r, n.y + n.h);
    ctx.arcTo(n.x, n.y + n.h, n.x, n.y + n.h - r, r);
    ctx.lineTo(n.x, n.y + r);
    ctx.arcTo(n.x, n.y, n.x + r, n.y, r);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = n.color;
    ctx.beginPath();
    ctx.moveTo(n.x + r, n.y);
    ctx.lineTo(n.x + n.w - r, n.y);
    ctx.arcTo(n.x + n.w, n.y, n.x + n.w, n.y + r, r);
    ctx.lineTo(n.x + n.w, n.y + 4);
    ctx.lineTo(n.x, n.y + 4);
    ctx.lineTo(n.x, n.y + r);
    ctx.arcTo(n.x, n.y, n.x + r, n.y, r);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = isSelected ? '#fff' : '#e2e8f0';
    ctx.font = 'bold 11px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    let displayName = t.length > 22 ? t.substring(0, 20) + '...' : t;
    ctx.fillText(displayName, n.x + n.w / 2, n.y + 22);

    const cols = tableColumns[t] || [];
    const colCount = cols.length;
    const fkCount = fkData.filter(fk => fk.from === t).length;
    const refCount = fkData.filter(fk => fk.to === t).length;

    ctx.fillStyle = '#94a3b8';
    ctx.font = '10px -apple-system, sans-serif';
    ctx.fillText(`${colCount} cols  ${fkCount} FK  ${refCount} ref`, n.x + n.w / 2, n.y + 42);

    ctx.globalAlpha = 1;
  });

  ctx.restore();
}

function getNodeAt(mx, my) {
  const x = (mx - offsetX) / scale;
  const y = (my - offsetY) / scale;
  for (const t of allTables) {
    const n = nodes[t];
    if (x >= n.x && x <= n.x + n.w && y >= n.y && y <= n.y + n.h) return t;
  }
  return null;
}

canvas.addEventListener('mousedown', e => {
  const t = getNodeAt(e.offsetX, e.offsetY);
  if (t) {
    selectTable(t);
  } else {
    dragging = true;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    dragOffsetX = offsetX;
    dragOffsetY = offsetY;
  }
});

canvas.addEventListener('mousemove', e => {
  if (dragging) {
    offsetX = dragOffsetX + (e.clientX - dragStartX);
    offsetY = dragOffsetY + (e.clientY - dragStartY);
    draw();
  } else {
    const t = getNodeAt(e.offsetX, e.offsetY);
    if (t !== hoveredNode) {
      hoveredNode = t;
      canvas.style.cursor = t ? 'pointer' : 'grab';
      draw();
    }
  }
});

canvas.addEventListener('mouseup', () => { dragging = false; });
canvas.addEventListener('mouseleave', () => { dragging = false; hoveredNode = null; draw(); });
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  const mx = e.offsetX, my = e.offsetY;
  offsetX = mx - (mx - offsetX) * delta;
  offsetY = my - (my - offsetY) * delta;
  scale *= delta;
  scale = Math.max(0.2, Math.min(3, scale));
  draw();
}, { passive: false });

function zoomIn() { scale = Math.min(3, scale * 1.2); draw(); }
function zoomOut() { scale = Math.max(0.2, scale * 0.8); draw(); }
function resetView() { scale = 0.7; offsetX = 50; offsetY = 50; draw(); }

function selectTable(t) {
  selectedTable = t;
  showDetail(t);
  highlightSidebarItem(t);
  draw();
}

function showDetail(t) {
  const panel = document.getElementById('detail-panel');
  const content = document.getElementById('detail-content');
  const cols = tableColumns[t] || [];
  const outgoing = fkData.filter(fk => fk.from === t);
  const incoming = fkData.filter(fk => fk.to === t);
  const gi = tableGroupMap[t];

  let html = `<h2>${t}</h2>`;
  html += `<div class="subtitle">${gi.group} &bull; ${cols.length} columns &bull; ${outgoing.length} foreign keys &bull; ${incoming.length} references</div>`;

  html += `<table class="col-table"><thead><tr><th>Column</th><th>Type</th><th>Info</th></tr></thead><tbody>`;
  cols.forEach(c => {
    const isPk = c.is_pk === 'YES';
    const isFk = outgoing.some(fk => fk.fromCol === c.name);
    let info = '';
    if (isPk) info += '<span class="pk">PK</span> ';
    if (isFk) info += '<span class="fk">FK</span> ';
    if (c.nullable === 'YES') info += '<span class="nullable">null</span>';
    html += `<tr><td>${isPk ? '<span class="pk">' + c.name + '</span>' : isFk ? '<span class="fk">' + c.name + '</span>' : c.name}</td><td>${c.type}</td><td>${info}</td></tr>`;
  });
  html += `</tbody></table>`;

  if (outgoing.length > 0) {
    html += `<div class="relations-section"><h3>References (FK &rarr;)</h3>`;
    outgoing.forEach(fk => {
      html += `<div class="relation-item" onclick="selectTable('${fk.to}')">${fk.fromCol} <span class="arrow-icon">&rarr;</span> <strong>${fk.to}</strong>.${fk.toCol}</div>`;
    });
    html += `</div>`;
  }

  if (incoming.length > 0) {
    html += `<div class="relations-section"><h3>Referenced By (&larr;)</h3>`;
    incoming.forEach(fk => {
      html += `<div class="relation-item" onclick="selectTable('${fk.from}')"><strong>${fk.from}</strong>.${fk.fromCol} <span class="arrow-icon">&rarr;</span> ${fk.toCol}</div>`;
    });
    html += `</div>`;
  }

  content.innerHTML = html;
  panel.classList.add('open');
}

function closeDetail() {
  document.getElementById('detail-panel').classList.remove('open');
  selectedTable = null;
  draw();
}

function highlightSidebarItem(t) {
  document.querySelectorAll('.table-item').forEach(el => el.classList.remove('active'));
  const el = document.querySelector(`.table-item[data-table="${t}"]`);
  if (el) { el.classList.add('active'); el.scrollIntoView({ block: 'nearest' }); }
}

function buildSidebar() {
  const groupsEl = document.getElementById('groups');
  let html = '';
  Object.entries(groupDefs).forEach(([group, def]) => {
    html += `<div class="group-header" onclick="toggleGroup(this)">
      <span><span class="legend-dot" style="background:${def.color};display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle"></span>${group} <span class="table-count">(${def.tables.length})</span></span>
      <span class="arrow">&#9660;</span>
    </div>`;
    html += `<div class="group-tables">`;
    def.tables.forEach(t => {
      if (tableColumns[t]) {
        html += `<div class="table-item" data-table="${t}" onclick="selectTable('${t}')">${t}</div>`;
      }
    });
    html += `</div>`;
  });
  groupsEl.innerHTML = html;

  const statsEl = document.getElementById('stats');
  statsEl.textContent = `${allTables.length} tables \u2022 ${fkData.length} relationships`;
}

function toggleGroup(header) {
  const tables = header.nextElementSibling;
  const arrow = header.querySelector('.arrow');
  if (tables.style.display === 'none') {
    tables.style.display = '';
    arrow.classList.remove('collapsed');
  } else {
    tables.style.display = 'none';
    arrow.classList.add('collapsed');
  }
}

document.getElementById('search').addEventListener('input', function() {
  const q = this.value.toLowerCase();
  document.querySelectorAll('.table-item').forEach(el => {
    el.style.display = el.dataset.table.includes(q) ? '' : 'none';
  });
  document.querySelectorAll('.group-header').forEach(h => {
    const tables = h.nextElementSibling;
    const visible = tables.querySelectorAll('.table-item:not([style*="display: none"])').length;
    h.style.display = visible > 0 || !q ? '' : 'none';
    if (q && visible > 0) { tables.style.display = ''; }
  });
});

initNodes();
buildSidebar();
resize();
window.addEventListener('resize', resize);
</script>
